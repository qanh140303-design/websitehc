<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- ADMIN:SEO (trang quản trị ghi đè khối này) -->
  <title>Giỏ hàng – Hương Chất Kids</title>
  <meta name="description" content="Giỏ hàng của mẹ tại Hương Chất Kids.">
  <!-- /ADMIN:SEO -->
  <meta name="robots" content="noindex, follow">
  <script src="js/seo.js?v=lc2" defer></script>
  <meta name="theme-color" content="#F0537A">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Phông chữ thường: display=optional (trang không nhảy). Phông tiêu đề Baloo 2 + chữ viết tay: display=swap để luôn hiện đúng phông khi tải xong -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Quicksand:wght@600;700&display=optional" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Quicksand:wght@600;700&display=optional"></noscript>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Patrick+Hand&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Patrick+Hand&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css?v=20261019j">
  <link rel="stylesheet" href="css/rd/base.css?v=lc6">
  <link rel="stylesheet" href="css/rd/motion.css?v=lc2">
  <link rel="stylesheet" href="css/rd/y-shop.css?v=y2">
  <link rel="stylesheet" href="css/rd/be.css?v=b1">
  <link rel="stylesheet" href="css/rd/shop.css?v=lc7">
  <link rel="stylesheet" href="css/rd/vui.css?v=v1">
  <link rel="icon" type="image/png" sizes="96x96" href="img/logo-96.png"><link rel="apple-touch-icon" href="img/logo-192.png">
</head>
<body>
<div class="dau-cho" aria-hidden="true"></div>
<main id="app"><div class="container">
  <nav class="breadcrumb"><a href="index.html">Trang chủ</a><span>›</span><span>Giỏ hàng</span></nav>
  <div class="shop-head">
    <h1 class="page-title">Giỏ hàng của mẹ</h1>
    <ol class="co-steps" aria-label="Các bước đặt hàng">
      <li class="is-on" aria-current="step"><span class="co-steps__ico"><img class="rd-emo" src="img/rd/icons/cart.webp" alt="" width="28" height="28"></span><span>Giỏ hàng</span></li>
      <li><span class="co-steps__ico"><img class="rd-emo" src="img/rd/icons/user.webp" alt="" width="28" height="28"></span><span>Thông tin</span></li>
      <li><span class="co-steps__ico"><img class="rd-emo" src="img/rd/icons/gift.webp" alt="" width="28" height="28"></span><span>Đặt hàng</span></li>
    </ol>
  </div>
  <div class="checkout mt-16" id="cartPage"></div>
</div></main>
<script src="js/data.js?v=20261020m" defer></script>
<script src="js/le-hoi.js?v=20261019c" defer></script>
<script src="js/qrcode.min.js" defer></script>
<script src="js/app.js?v=20261020m" defer></script>
<script src="js/rd-motion.js?v=lc3" defer></script>
<script src="js/rd-y-shop.js?v=y3" defer></script>
<script src="js/rd-be.js?v=b4" defer></script>
<script src="js/rd-vui.js?v=v1" defer></script>
<script src="js/chat.js?v=20261019e" defer></script>
<script type="module">
document.addEventListener('DOMContentLoaded', () => {
  const { $, $$, fmt, I, listPrice, productThumb, shortName, productCard, Cart, esc, shipFee, shipText, applyCoupon, store, toast, giftFor, giftBox, rdIcon } = MC;
  window.addEventListener('mc:ma-gh', () => render());   // máy chủ trả số lượt dùng của mã có giới hạn
  const render = () => {
    const lines = Cart.lines(); const sub = Cart.subtotal(); const multi = Cart.multiDiscount(); const coupon = store.get('mc_coupon', '') || MC.maTotNhat(sub - multi, lines); const c = coupon ? applyCoupon(coupon, sub - multi, lines) : null;
    const discount = c && c.ok ? c.discount : 0; const ship = c && c.ok && c.freeship ? 0 : shipFee(sub - multi - discount); const total = Math.max(0, sub - multi - discount) + (ship || 0);
    if (!lines.length) { $('#cartPage').innerHTML = `<div class="empty empty--rd card" style="grid-column:1/-1"><span class="rd-doodle-swap empty__doodle" aria-hidden="true"><img class="rd-doodle rd-doodle--md rd-doodle--wave" src="img/rd/doodles/giot-sua-vui.svg" alt="" width="96" height="96"><img class="rd-doodle rd-doodle--md" src="img/rd/doodles/giot-sua-wow.svg" alt="" width="96" height="96"></span><h3>Giỏ hàng đang trống</h3><p>Mẹ chọn sản phẩm phù hợp với bé nhé!</p><a class="btn btn--primary btn--lg mt-16" href="collections.html">Xem sản phẩm</a></div><section class="section" style="grid-column:1/-1"><div class="section-head"><div><h2>Mẹ tin dùng nhất</h2></div></div><div class="grid grid--4">${[...PRODUCTS].sort((a, b) => b.sold - a.sold).slice(0, 4).map((p) => productCard(p)).join('')}</div></section>`; return; }
    $('#cartPage').innerHTML = `
      <div class="cart-main">
      <div class="card card--pad cart-table">
        <div class="freeship-bar mb-12">${rdIcon(sub >= SITE.freeshipFrom ? 'party' : 'truck', 32, '', 'freeship-bar__ico')}<div class="freeship-bar__txt">${sub >= SITE.freeshipFrom ? 'Đơn hàng được <b>miễn phí vận chuyển</b>' : `Mua thêm <b>${fmt(SITE.freeshipFrom - sub)}</b> để được <b>freeship</b>`}<div class="bar"><i style="width:${Math.min(100, sub / SITE.freeshipFrom * 100)}%"></i></div></div></div>
        ${giftBox(giftFor(lines, MC.maChoQua(c)))}
        ${lines.map((l) => `<div class="cart-item"><a href="${MC.spUrl(l.id)}"><img src="${productThumb(l.p)}" alt=""></a><div><a class="name" href="${MC.spUrl(l.id)}">${esc(shortName(l.p))}</a>${l.variantLabel ? `<div class="variant">Phân loại: ${esc(l.variantLabel)}</div>` : ''}<div class="price">${fmt(l.price)}${listPrice(l.oldPrice, l.price) ? `<s>${fmt(l.oldPrice)}</s>` : ''}</div></div>
          <div class="ctrl"><div class="qty qty--sm" role="group" aria-label="Số lượng ${esc(shortName(l.p))}"><button type="button" data-qty-minus="${l.id}" data-variant="${l.variant}" aria-label="Giảm số lượng">−</button><input type="number" value="${l.qty}" min="1" inputmode="numeric" aria-label="Số lượng" data-qty-input="${l.id}" data-variant="${l.variant}"><button type="button" data-qty-plus="${l.id}" data-variant="${l.variant}" aria-label="Tăng số lượng">+</button></div></div>
          <div class="total">${fmt(l.total)}</div><button class="remove" type="button" data-remove="${l.id}" data-variant="${l.variant}" aria-label="Xoá ${esc(shortName(l.p))} khỏi giỏ" title="Xoá">${I.trash}</button></div>`).join('')}
        <div class="cart-more"><a class="btn btn--ghost" href="collections.html">${I.chevronL}Tiếp tục mua sắm</a></div>
      </div>
      </div>
      <div class="checkout__side"><div class="card card--pad cart-summary">
        <h3>${rdIcon('package', 30, '', 'rd-sticker rd-sticker--thin')}Tóm tắt đơn hàng</h3>
        <div class="coupon"><input class="input" id="couponInput" placeholder="Nhập mã giảm giá (nếu có)" aria-label="Mã giảm giá" value="${esc(coupon)}"><button class="btn btn--dark" type="button" id="applyCoupon">Áp dụng</button></div>${MC.chipMaDaLuu(sub - multi, lines, coupon)}
        <div class="coupon-hint">${c && c.ok ? `<span class="text-teal fw-600">✓ ${c.desc}</span>` : c ? `<span class="text-red">${c.msg}</span>` : `<span class="text-muted">Có mã giảm giá của shop thì mẹ nhập vào đây nhé.</span>`}</div>
        <div class="divider"></div>
        <div class="summary-line"><span>Tạm tính (${Cart.count()} sản phẩm)</span><span>${fmt(sub)}</span></div>
        ${multi ? `<div class="summary-line"><span>Mua từ 2 giảm 3%</span><span class="text-teal">−${fmt(multi)}</span></div>` : ''}
        ${discount ? `<div class="summary-line"><span>Giảm giá (${c.code})</span><span class="text-teal">−${fmt(discount)}</span></div>` : ''}
        ${(() => { const g = giftFor(lines, MC.maChoQua(c)); return g && g.soQua ? `<div class="summary-line"><span>Quà tặng</span><span class="text-teal">${rdIcon('gift', 20)} ${esc(g.moTa)}</span></div>` : ''; })()}
        <div class="summary-line"><span>Phí vận chuyển</span><span class="${ship === 0 ? 'free' : ''}">${shipText(ship)}</span></div>
        <div class="summary-line total"><span>${ship === null ? 'Tổng (chưa gồm ship)' : 'Tổng cộng'}</span><b>${fmt(total)}</b></div>
        <a class="btn btn--primary btn--lg btn--block mt-16" href="checkout.html">${I.zap}Đặt hàng · ${fmt(total)}</a>
        <div class="qb__trust"><span>${I.check}Kiểm tra hàng trước khi thanh toán</span><span>${I.check}Đổi trả 7 ngày</span></div>
        <div class="divider"></div>
        <p class="fs-13 text-muted" style="text-align:center">Cần tư vấn thêm? <a class="fw-700 text-primary" href="tel:${SITE.hotlineTel}">${SITE.hotline}</a> hoặc <a class="fw-700" style="color:var(--zalo)" href="${SITE.zalo}" target="_blank">Chat Zalo</a></p>
      </div></div>
      <p class="cart-clear"><button class="cart-clear__btn" type="button" id="clearCart">Xoá toàn bộ giỏ</button></p>
      <div class="sticky-order cart-sticky" id="cartSticky"><div class="tot">${ship === null ? 'Tổng (chưa gồm ship)' : 'Tổng cộng'}<b>${fmt(total)}</b></div><a class="btn btn--primary" href="checkout.html">${I.zap}Đặt hàng</a></div>`;
  };
  document.addEventListener('cart:change', render);
  $('#cartPage').addEventListener('click', (e) => {
    if (e.target.id === 'applyCoupon') { const code = $('#couponInput').value.trim().toUpperCase(); const r = applyCoupon(code, Cart.subtotal() - Cart.multiDiscount(), Cart.lines()); store.set('mc_coupon', r.ok ? code : ''); toast(r.ok ? 'Đã áp dụng ' + code : r.msg, { type: r.ok ? 'ok' : 'error' }); render(); }
    const cb = e.target.closest('[data-coupon]'); if (cb) { store.set('mc_coupon', cb.dataset.coupon); render(); }
    if (e.target.id === 'clearCart' && confirm('Xoá toàn bộ sản phẩm trong giỏ?')) { Cart.clear(); }
  });
  render();
});
</script>
</body>
</html>
